    <!-- 4. FAQPage — Extended per Section 10 content formula -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Syphrone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Syphrone is a privacy-first, browser-based cryptographic platform. It helps you encrypt messages using AES-256-GCM, generate RSA-2048 key pairs, hide messages in images via steganography, and encode text using Morse code, DNA cipher, zero-width Unicode, and other methods — entirely inside your browser."
          }
        },
        {
          "@type": "Question",
          "name": "How does Syphrone encrypt messages?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Syphrone uses the Web Crypto API with AES-256-GCM symmetric encryption. Keys are derived from your password using PBKDF2 with 310,000 iterations and a random 16-byte salt. A random 12-byte IV (nonce) is generated per operation. No plaintext or key material is sent to any server."
          }
        },
        {
          "@type": "Question",
          "name": "Does Syphrone store my messages on any server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. All core cryptographic operations run 100% client-side inside your browser. No plaintext, encryption key, or ciphertext is ever transmitted to a Syphrone server. The Secure Vault stores encrypted data locally in your browser's storage."
          }
        },
        {
          "@type": "Question",
          "name": "What encryption methods does Syphrone support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Syphrone supports AES-256-GCM encryption, RSA-2048 key pair generation, PNG steganography (hiding messages in images), zero-width Unicode cipher, Morse code encoding and decoding, DNA code cipher, Emoji cipher, binary encoding, and hex encoding."
          }
        },
        {
          "@type": "Question",
          "name": "What is steganography in Syphrone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Syphrone's steganography tool hides a secret message inside the pixel data of a PNG image. The resulting image looks visually identical to the original but carries the hidden message embedded in the least-significant bits of pixel values."
          }
        },
        {
          "@type": "Question",
          "name": "Who built Syphrone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Syphrone was built by Armaan Sunasara, co-founder and full stack developer at Techyboy (techyboy.live)."
          }
        },
        {
          "@type": "Question",
          "name": "Is Syphrone free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. All core cryptographic tools are free. Premium visual themes can be unlocked with Syphrone Coins earned by using the app."
          }
        },
        {
          "@type": "Question",
          "name": "Does Syphrone work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Once installed as a Progressive Web App (PWA), Syphrone's core encryption and decryption tools work without an internet connection."
          }
        },
        {
          "@type": "Question",
          "name": "What is client-side encryption?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Client-side encryption means the encryption and decryption operations happen entirely inside the user's browser on their own device. The server never sees plaintext data, keys, or intermediate values. Syphrone uses the browser's built-in Web Crypto API for this purpose."
          }
        },
        {
          "@type": "Question",
          "name": "What does Syphrone not protect against?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Syphrone is not a VPN, secure messaging protocol, or password manager. It does not protect against device-level threats, keyloggers, screen capture, or malware on your device. Its encryption is limited to the browser environment."
          }
        }
      ]
    }
    </script>
