# ──────────────────────────────────────────────────────────────────────────────
# Syphrone — netlify.toml
# Guide reference: Sections 14 (Performance), 15 (Security-Aware SEO), 16 (OWASP)
# Last updated: 2026-08-20
# ──────────────────────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
# Guide Section 3: HTTP must permanently redirect to HTTPS
[[redirects]]
  from   = "http://syphrone.netlify.app/*"
  to     = "https://syphrone.netlify.app/:splat"
  status = 301
  force  = true

# ── SPA fallback (React Router / hash routing support) ───────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security & SEO Headers ────────────────────────────────────────────────────
# Applied to all routes
[[headers]]
  for = "/*"
  [headers.values]

    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Referrer — balance privacy with analytics needs
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions policy — deny unused sensor APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # HSTS — enforce HTTPS for 1 year (Section 15 — OWASP A02)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Cross-Origin policies (OWASP A02 — Security Misconfiguration)
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "cross-origin"

    # Prevent cross-domain content loading
    X-Permitted-Cross-Domain-Policies = "none"

    # Content-Security-Policy
    # Allows: self, Firebase (auth), Google Fonts, Font Awesome CDN, imgbb (og:image)
    # Disallows: all other script origins, inline eval, object embeds
    # Note: nonce-based CSP is preferred for prod; this policy is safe for current deps
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline'
        https://www.gstatic.com
        https://apis.google.com
        https://www.googleapis.com;
      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://cdnjs.cloudflare.com;
      font-src 'self'
        https://fonts.gstatic.com
        https://cdnjs.cloudflare.com;
      img-src 'self' data: blob:
        https://i.ibb.co
        https://lh3.googleusercontent.com
        https://www.gravatar.com;
      connect-src 'self'
        https://*.googleapis.com
        https://*.firebaseapp.com
        https://*.firebase.com
        https://identitytoolkit.googleapis.com
        https://securetoken.googleapis.com;
      media-src 'self' blob:;
      worker-src 'self' blob:;
      child-src 'self' blob:;
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      manifest-src 'self';
      upgrade-insecure-requests;
    """

# ── Cache immutable hashed assets aggressively (Section 14) ──────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache sitemap / robots freshly ───────────────────────────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "text/plain; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/manifest+json; charset=utf-8"
